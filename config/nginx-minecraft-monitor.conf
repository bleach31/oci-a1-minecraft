server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate /etc/nginx/minecraft-monitor.crt;
    ssl_certificate_key /etc/nginx/minecraft-monitor.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = /minecraft {
        return 301 /minecraft/;
    }

    location /minecraft/ {
        auth_basic "Minecraft monitor";
        auth_basic_user_file /etc/nginx/minecraft-monitor.htpasswd;
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host localhost:8080;
        proxy_set_header Origin "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 15s;
    }

    location / {
        return 404;
    }
}